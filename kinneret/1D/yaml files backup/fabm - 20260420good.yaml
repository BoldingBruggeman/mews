      llim: 3                           # light limitation of growth (1: Reynolds, 2: Selma, 3: Reynolds-smoothed), default = 1
      alpha_light: 0.222                # Reynolds (llim=1): the slope of light-dependent growth (d-1 [W/m2]-1), default=0.1
      imin: 3.59                       # llim=2; minimal optimal light radiation, default = 50; llim=3;minimal light radiation for growth, default = 0.0 (W/m2)'
