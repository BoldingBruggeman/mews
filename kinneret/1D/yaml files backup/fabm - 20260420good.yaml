      rfr: 0.0102                        # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.179                       # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      alpha_n: 0.00                   # half-saturation for nitrogen uptake, ('mmol C/m3),default=self%alpha)
      alpha_p: 0.00396              # half-saturation for phophorus uptake, ('mmol C/m3),default=self%alpha)
      r0: 1.51                        # maximum growth rate at 20 degrees C (1/d), default = 1.3
