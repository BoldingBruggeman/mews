instances:
  selmaprotbas:
    model: selmaprotbas/selmaprotbas
    parameters:
      env_type: marine                # (Define environment type, either fresh or marine), default = marine
      wdz: -0.25                    # vertical velocity of detritus (positive: upwards/floating, negative: downwards/sinking) (m/d), default = -4.5
      wpo4: -1.76                      # vertical velocity of suspended P-Fe (positive: upwards/floating, negative: downwards/sinking) (m/d), default = -1.0
      dn: 0.001                    # detritus mineralization rate (1/d), default = 0.003
      dn_sed: 0.000013               # sediment mineralization rate (1/d), default = 0.002 0.0098
      mbnnrate: 0.18                # mineralization by nitrate rate relative to dn mineralization by oxygen (-), default = 0.1
      mbsrate: 0.25                 # mineralization by sulphate rate relative to dn mineralization by oxygen (-), default = 0.1
      nitrif_rate: 0.004          # nitrification rate (1/d), default=0.1
      den_frac_denanmx: 1.0        # relative contribution of denitrification out of total denitrification + anammox (-), default = 1.0
      den_frac_denanmx_sed: 0.8    # relative contribution of denitrification out of total denitrification + anammox in sediment (-), default = 1.0
      ade_r0: 0.0                     # maximum chemoautolithotrophic denitrification rate (1/d), default = 0.1
      alphaade: 1.0                   # half-saturation constant for chemoautolithotrophic denitrification (mmol N/m3), default = 1.0
      q10_rec: 0.145                # temperature dependence of detritus remineralization (1/K), default = 0.175; 0.078
      q10_recs: 0.129                # temperature dependence of sediment remineralization (1/K), default = 0.175; 0.088
      kc: 0.000622                      # specific light attenuation of detritus (m2/mmol C)
      tau_crit: 0.07                # critical shear stress (N/m2), default = 0.07
      sedrate: 1.48                 # detritus sedimentation rate (m/d), default = 2.25
      erorate: 0.04                    # sediment erosion rate (1/d), default = 6.0
      sedratepo4: 0.619               # P-Fe sedimentation rate (m/d), default = 0.5
      eroratepo4: 0.04               # P-Fe erosion rate (1/d), default = 6.0
      po4ret: 0.99               # phosphate retention rate, oxic sediments (-), default = 0.18
      pburialrate: 3e-08          # phosphate burial rate (1/d), default = 0.007
      fl_burialrate: 0.00000          # sediment burial rate (1/d), default = 0.001
      pliberationrate: 3e-05        # phosphate liberation rate, anoxic sediments (1/d), default = 0.1
      ipo4th: 100                 # maximum phosphorus density available for burial (mmol P/m2), default = 100.0
      br0: 0.000158                     # bioresuspension rate (1/d), default = 0.03
      fds: 0.65                    # fraction of sediment remineralization fueled by denitrification (-), default = 0.7
      pvel: 3.81                    # piston velocity (m/d), default = 5.0
      newflux: 2                      # oxygen flux type (-), default = 2
    initialization:
      nn: 9.5                           # nitrate (mmol N/m3)
      aa: 5.6                           # ammonium (mmol N/m3)
      dd_c: 106                         # carbon detritus (mmol C/m3)
      dd_p: 0.5                        # phosphorus detritus (mmol P/m3)
      dd_n: 15.0                        # nitrogen detritus (mmol N/m3)
      dd_si: 20.0                       # silica detritus (mmol Si/m3)
      o2: 278.0                         # oxygen (mmol O2/m3)
      po: 0.06                         # phosphate (mmol P/m3)
      si: 1.0                           # silicate (mmol Si/m3)
      fl_c: 800000                      # carbon fluff (mmol C/m2)
      fl_p: 300                        # phosphorus fluff (mmol P/m2)550
      fl_n: 140000                       # nitrogen fluff (mmol N/m2)
      fl_si: 14                        # silica fluff (mmol Si/m2)
      pb: 3310                           # phosphate bound to iron in sediment (mmol P/m2)
      pw: 0.2                         # phosphate bound to iron in water (mmol P/m3)
  ammonium_input:
    model: constant_surface_flux        # change to external_surface_flux if supplied from external file
    parameters:
      flux: 1.49e-07                    # flux (positive for into water) (UNITS m-2 s-1)
    coupling:
      target: selmaprotbas/aa           # target variable (UNITS m-3)
  nitrate_input:
    model: constant_surface_flux
    parameters:
      flux: 3.8e-07                     # flux (positive for into water) (UNITS m-2 s-1)
    coupling:
      target: selmaprotbas/nn           # target variable (UNITS m-3)
  phosphate_input:
    model: constant_surface_flux
    parameters:
      flux: 4.5e-07                         # flux (positive for into water) (UNITS m-2 s-1) 8.5e-08
    coupling:
      target: selmaprotbas/po           # target variable (UNITS m-3)
  detritus_input_c:
    model: constant_surface_flux
    parameters:
      flux: 6.9e-06                     # flux (positive for into water) (UNITS m-2 s-1)6.9e-06
    coupling:
      target: selmaprotbas/dd_c         # target variable (UNITS m-3)
  detritus_input_p:
    model: constant_surface_flux
    parameters:
      flux: 3.32e-07                         # flux (positive for into water) (UNITS m-2 s-1)
    coupling:
      target: selmaprotbas/dd_p         # target variable (UNITS m-3)
  detritus_input_n:
    model: constant_surface_flux
    parameters:
      flux: 5.84e-07                    # flux (positive for into water) (UNITS m-2 s-1)
    coupling:
      target: selmaprotbas/dd_n         # target variable (UNITS m-3)
  Lyngbya:
    model: selmaprotbas/phytoplankton
    parameters:
      c0: 0.0006                        # background concentration (mmol C/m3), default = 0.0
      rfr: 0.00734                      # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.132                       # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      rfs: 0.0                          # silica : carbon ratio (mol Si/mol C), default = 0.000
      alpha_n: 0.207                   # half-saturation concentration for nitrogen uptake (mmol N/m3), default = 0.25
      alpha_p: 0.00861                 # half-saturation concentration for phosphorus uptake (mmol P/m3), default = 0.015625
      r0: 0.9                          # maximum growth rate; tlim=1 - at 0 degC and 2*r0 at temp>>sqrt(tll); tlim=2 - at temp>>tll; tlim=3 or 4 - at 20 degC; tlim=5 - at temp_opt, default = 1.3
      nb: 0.01                         # excretion rate (1/d), default = 0.01
      deltao: 0.0201                    # mortality rate (1/d), default = 0.02
      Yc: 6.25                          # carbon : chlorophyll a ratio (mmol C/mg Chl a), default = 6.25
      wz: 0.0                           # vertical velocity (positive: upwards/floating, negative: downwards/sinking) (m/d), default = 0.0
      kc: 0.00122                       # specific light attenuation (m2/mmol C)
      sedrate: 0.1                      # sedimentation rate (m/d), default = 0.0
      tau_crit: 0.07                    # critical shear stress (N/m2), default = 0.07
      buoyancy_regulation: false        # whether cells can regulate vertical movement, default=false
      buoy_temperature: false           # whether temperature can regulate buoyancy, if buoyancy_regulation=true, default=false
      buoy_nutrient: false              # whether nutrient limitation can regulate buoyancy, if buoyancy_regulation=true, default=false
      tlim: 2                           # temperature limitation of growth (0: none, 1: flagellate-style, 2: cyanobacteria-style, 3:PROTECH-style, 4:optimal-stdev, 5: Lehman-equation), default = 0
      tll: 26.6                       # tlim=1; half-saturation temperature, squared, default = 100 (degrees C^2); tlim=2; lower temperature limit, default = 13.5 (degrees C)
      llim: 3                           # light limitation of growth (1: Reynolds, 2: Selma, 3: Reynolds-smoothed), default = 1
      alpha_light: 0.0674                # Reynolds (llim=1): the slope of light-dependent growth (d-1 [W/m2]-1), default=0.1
      imin: 1.01                        # llim=2; minimal optimal light radiation, default = 50; llim=3;minimal light radiation for growth, default = 0.0 (W/m2)'
      use_24h_light: false              # use 24h averaged light for growth, default = false
      diagnostics: true
    coupling:
      aa: selmaprotbas/aa               # ammonium (mmol N/m3)
      nn: selmaprotbas/nn               # nitrate (mmol N/m3)
      o2: selmaprotbas/o2               # oxygen (mmol O2/m3)
      po: selmaprotbas/po               # phosphate (mmol P/m3)
      si: selmaprotbas/si               # silicate (mmol Si/m3)
      dd_c: selmaprotbas/dd_c           # carbon detritus (mmol C/m3)
      dd_p: selmaprotbas/dd_p           # phosphorus detritus (mmol P/m3)
      dd_n: selmaprotbas/dd_n           # nitrogen detritus (mmol N/m3)
      dd_si: selmaprotbas/dd_si         # silica detritus (mmol Si/m3)
      fl_c: selmaprotbas/fl_c           # carbon fluff (mmol C/m3)
      fl_p: selmaprotbas/fl_p           # phosphorus fluff (mmol P/m3)
      fl_n: selmaprotbas/fl_n           # nitrogen fluff (mmol N/m3)
      fl_si: selmaprotbas/fl_si         # silica fluff (mmol Si/m3)
    initialization:
      c: 0.0758                         # concentration (mmol C/m3)
  CyanoMC:
    model: selmaprotbas/phytoplankton
    parameters:
      c0: 0.001                        # background concentration (mmol C/m3), default = 0.0
      rfr: 0.0205                     # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434 ; 0.014
      rfn: 0.154                       # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      rfs: 0                            # silica : carbon ratio (mol Si/mol C), default = 0.000
      alpha_n: 0.103                 # half-saturation for nitrogen uptake, ('mmol C/m3),default=self%alpha)
      alpha_p: 0.0165                   # half-saturation for phophorus uptake, ('mmol C/m3),default=self%alpha)
      r0: 1.84                        # maximum growth rate at 20 degrees C (1/d), default = 1.3
      nitrogen_fixation: false          # whether nitrogen fixation is used to acquire nitrogen, default = false
      nb: 0.0105                      # excretion rate (1/d), default = 0.01
      deltao: 0.0203                  # mortality rate (1/d), default = 0.02
      Yc: 7.85                          # carbon : chlorophyll a ratio (mmol C/mg Chl a), default = 6.25
      wz: 0.0                        # vertical velocity (positive: upwards/floating, negative: downwards/sinking) (m/d), default = 0.0
      buoyancy_regulation: true
      par_limit1: 25                    # below this light intensity, buoyancy-regulating plankton change vertical velocity from vert_vel1 to vert_vel2, (W/m2)
      par_limit2: 20                    # below this light intensity, buoyancy-regulating plankton change vertical velocity to vert_vel3, (W/m2)
      par_limit3: 10                    # below this light intensity, buoyancy-regulating plankton change vertical velocity to vert_vel4, (W/m2)
      vert_vel1: -0.3                   # rate of vertical movement above par_limit1, if buoyancy_regulation=true, (m/d)
      vert_vel2: -0.1                   # rate of vertical movement below par_limit1 and above par_limit2, if buoyancy_regulation=true, (m/d)
      vert_vel3: 0                      # rate of vertical movement below par_limit2 and above par_limit3, if buoyancy_regulation=true, (m/d)
      vert_vel4: 0.4                    # rate of vertical movement below par_limit3 and above par_limit4, if buoyancy_regulation=true, (m/d)
      kc: 0.0015                         # specific light attenuation (m2/mmol C)
      sedrate: 0.001                    # sedimentation rate (m/d), default = 0.0
      tau_crit: 0.05                    # critical shear stress (N/m2), default = 0.07
      tlim: 5                           # temperature limitation of growth (0: none, 1: flagellate-style, 2: cyanobacteria-style, 3:PROTECH-style, 4:optimal-stdev, 5: Lehman-equation), default = 0
      temp_opt: 15.9                    # tlim=5; optimum temperature of growth rate, default=20.0, (degrees C)
      temp_min: 8.33                    # tlim=5; temperature below optimum where growth is 10% of maximum, default=0,(degrees C)
      llim: 3                           # light limitation of growth (1: Reynolds, 2: Selma, 3: Reynolds-smoothed), default = 1
      alpha_light: 0.399              # Reynolds (llim=1): the slope of light-dependent growth (d-1 [W/m2]-1), default=0.1
      imin: 8.45                        # llim=2; minimal optimal light radiation, default = 50; llim=3;minimal light radiation for growth, default = 0.0 (W/m2)'
      diagnostics: true
    coupling:
      aa: selmaprotbas/aa               # ammonium (mmol N/m3)
      nn: selmaprotbas/nn               # nitrate (mmol N/m3)
      o2: selmaprotbas/o2               # oxygen (mmol O2/m3)
      po: selmaprotbas/po               # phosphate (mmol P/m3)
      si: selmaprotbas/si               # silicate (mmol Si/m3)
      dd_c: selmaprotbas/dd_c           # carbon detritus (mmol C/m3)
      dd_p: selmaprotbas/dd_p           # phosphorus detritus (mmol P/m3)
      dd_n: selmaprotbas/dd_n           # nitrogen detritus (mmol N/m3)
      dd_si: selmaprotbas/dd_si         # silica detritus (mmol Si/m3)
      fl_c: selmaprotbas/fl_c           # carbon fluff (mmol C/m3)
      fl_p: selmaprotbas/fl_p           # phosphorus fluff (mmol P/m3)
      fl_n: selmaprotbas/fl_n           # nitrogen fluff (mmol N/m3)
      fl_si: selmaprotbas/fl_si         # silica fluff (mmol Si/m3)
    initialization:
      c: 0.356                          # concentration (mmol C/m3)
  NfixCyano:
