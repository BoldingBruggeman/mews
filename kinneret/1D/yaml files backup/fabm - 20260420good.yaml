      vert_vel4: 0.1
      kc: 0.00463                        # specific light attenuation (m2/mmol C)
      sedrate: 0.001                    # sedimentation rate (m/d), default = 0.0
      tau_crit: 0.05                    # critical shear stress (N/m2), default = 0.07
      tlim: 5                           # temperature limitation of growth (0: none, 1: flagellate-style, 2: cyanobacteria-style, 3:PROTECH-style, 4:optimal-stdev, 5: Lehman-equation), default = 0
      temp_opt: 30.1                    # tlim=5; optimum temperature of growth rate, default=20.0, (degrees C)
      temp_min: 15.6                    # tlim=5; temperature below optimum where growth is 10% of maximum, default=0,(degrees C)
      llim: 3                           # light limitation of growth (1: Reynolds, 2: Selma, 3: Reynolds-smoothed), default = 1
      alpha_light: 0.0459             # Reynolds (llim=1): the slope of light-dependent growth (d-1 [W/m2]-1), default=0.1
      imin: 2.35                       # llim=2; minimal optimal light radiation, default = 50; llim=3;minimal light radiation for growth, default = 0.0 (W/m2)'
      diagnostics: true
    coupling:
      aa: selmaprotbas/aa               # ammonium (mmol N/m3)
      nn: selmaprotbas/nn               # nitrate (mmol N/m3)
      o2: selmaprotbas/o2               # oxygen (mmol O2/m3)
      po: selmaprotbas/po               # phosphate (mmol P/m3)
      si: selmaprotbas/si               # silicate (mmol Si/m3)
      dd_c: selmaprotbas/dd_c           # carbon detritus (mmol C/m3)
      dd_p: selmaprotbas/dd_p           # phosphorus detritus (mmol P/m3)
      dd_n: selmaprotbas/dd_n           # nitrogen detritus (mmol N/m3)
      dd_si: selmaprotbas/dd_si         # silica detritus (mmol Si/m3)
      fl_c: selmaprotbas/fl_c           # carbon fluff (mmol C/m3)
      fl_p: selmaprotbas/fl_p           # phosphorus fluff (mmol P/m3)
      fl_n: selmaprotbas/fl_n           # nitrogen fluff (mmol N/m3)
      fl_si: selmaprotbas/fl_si         # silica fluff (mmol Si/m3)
    initialization:
      c: 0.352                          # concentration (mmol C/m3)
  Green:
    model: selmaprotbas/phytoplankton
    parameters:
      c0: 0.001                        # background concentration (mmol C/m3), default = 0.0
      rfr: 0.00769                   # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.0902                     # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      rfs: 0                            # silica : carbon ratio (mol Si/mol C), default = 0.000
      alpha_n: 0.061                    # half-saturation for nitrogen uptake, (mmol C/m3),default=0.25)
      alpha_p: 0.000843                # half-saturation for phophorus uptake, (mmol C/m3),default=0.0156)
      r0: 1.51                           # maximum growth rate at 20 degrees C (1/d), default = 1.3
      nb: 0.008                    # excretion rate (1/d), default = 0.01
      deltao: 0.02                 # mortality rate (1/d), default = 0.02
      Yc: 6.25                          # carbon : chlorophyll a ratio (mmol C/mg Chl a), default = 6.25
      wz: 1.0                         # vertical velocity (positive: upwards/floating, negative: downwards/sinking) (m/d), default = 0.0
      kc: 0.00424                         # specific light attenuation (m2/mmol C)
      sedrate: 0.001                    # sedimentation rate (m/d), default = 0.0
      tau_crit: 0.02                    # critical shear stress (N/m2), default = 0.07
      buoyancy_regulation: true        # whether cells can regulate vertical movement, default=false
      par_limit1: 25                    # below this light intensity, buoyancy-regulating plankton change vertical velocity from vert_vel1 to vert_vel2, (W/m2)
      par_limit2: 20                    # below this light intensity, buoyancy-regulating plankton change vertical velocity to vert_vel3, (W/m2)
      par_limit3: 10                    # below this light intensity, buoyancy-regulating plankton change vertical velocity to vert_vel4, (W/m2)
      vert_vel1: -0.3                   # rate of vertical movement above par_limit1, if buoyancy_regulation=true, (m/d)
      vert_vel2: -0.1                   # rate of vertical movement below par_limit1 and above par_limit2, if buoyancy_regulation=true, (m/d)
      vert_vel3: 0                      # rate of vertical movement below par_limit2 and above par_limit3, if buoyancy_regulation=true, (m/d)
      vert_vel4: 0.5                    # rate of vertical movement below par_limit3 and above par_limit4, if buoyancy_regulation=true, (m/d)
      buoy_temperature: false           # whether temperature can regulate buoyancy, if buoyancy_regulation=true, default=false
      buoy_nutrient: true               # whether nutrient limitation can regulate buoyancy, if buoyancy_regulation=true, default=false
      buoy_nutrient_limit: 0.5          # if nutrient limitation falls below this value (0-1), vertical velocity is set to vert_vel_nutrient (-), if buoyancy_regulation = true, default=0
      vert_vel_nutrient: 0.5            # vertical velocity at nutrient limitation below buoy_nutrient_limit (m/d), if buoyancy_regulation = true, default=vert_vel4
      tlim: 2                           # temperature limitation of growth (0: none, 1: flagellate-style, 2: cyanobacteria-style, 3:PROTECH-style, 4:optimal-stdev, 5: Lehman-equation), default = 0
      tll: 5.08                 # optimum temperature of growth rate, default=20 (degrees C)
      llim: 3                           # light limitation of growth (1: Reynolds, 2: Selma, 3: Reynolds-smoothed), default = 1
      alpha_light: 0.0639              # Reynolds (llim=1): the slope of light-dependent growth (d-1 [W/m2]-1), default=0.1
      imin: 1.84                      # llim=2; minimal optimal light radiation, default = 50; llim=3;minimal light radiation for growth, default = 0.0 (W/m2)'
      diagnostics: true
    coupling:
      aa: selmaprotbas/aa               # ammonium (mmol N/m3)
      nn: selmaprotbas/nn               # nitrate (mmol N/m3)
      o2: selmaprotbas/o2               # oxygen (mmol O2/m3)
      po: selmaprotbas/po               # phosphate (mmol P/m3)
      si: selmaprotbas/si               # silicate (mmol Si/m3)
      dd_c: selmaprotbas/dd_c           # carbon detritus (mmol C/m3)
      dd_p: selmaprotbas/dd_p           # phosphorus detritus (mmol P/m3)
      dd_n: selmaprotbas/dd_n           # nitrogen detritus (mmol N/m3)
      dd_si: selmaprotbas/dd_si         # silica detritus (mmol Si/m3)
      fl_c: selmaprotbas/fl_c           # carbon fluff (mmol C/m3)
      fl_p: selmaprotbas/fl_p           # phosphorus fluff (mmol P/m3)
      fl_n: selmaprotbas/fl_n           # nitrogen fluff (mmol N/m3)
      fl_si: selmaprotbas/fl_si         # silica fluff (mmol Si/m3)
    initialization:
      c: 50                           # concentration (mmol C/m3)
