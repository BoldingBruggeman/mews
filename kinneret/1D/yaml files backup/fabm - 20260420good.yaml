      deltao: 0.030                  # mortality rate (1/d), default = 0.02
      Yc: 3.84                          # carbon : chlorophyll a ratio (mmol C/mg Chl a), default = 6.25
      wz: 0.216                         # vertical velocity (positive: upwards/floating, negative: downwards/sinking) (m/d), default = 0.0
      buoyancy_regulation: true
      par_limit1: 220
      par_limit2: 170
      par_limit3: 100
      vert_vel1: -0.3
