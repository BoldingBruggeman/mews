  HerbZoo:
    model: selmaprotbas/zooplankton
    parameters:
      c0: 0.0001                         # background concentration (mmol C/m3), default = 0.0
      rfr: 0.0097                        # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.151                         # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
