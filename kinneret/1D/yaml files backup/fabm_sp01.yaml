      toptz: 27.25                       # optimal temperature for grazing (deg C), default = 20.0
      zcl1: 50.0                         # closure parameter (-), default = 50.0
    coupling:
      prey1: Diatom/c                    # prey 1 (mmol C/m3)
      prey2: NfixCyano/c                 # prey 2 (mmol C/m3)
      prey3: Green/c                     # prey 3 (mmol C/m3)
