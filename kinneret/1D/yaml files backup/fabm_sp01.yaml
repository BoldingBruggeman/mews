instances:
  Diatom:
    model: selmaprotbas/phytoplankton
    parameters:
      c0: 0.0046                         # background concentration (mmol C/m3), default = 0.0
      rfr: 0.0402                        # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.219                         # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      rfs: 0.1                           # silica : carbon ratio (mol Si/mol C), default = 0.000
      alpha: 0.417                       # half-saturation for nutrient uptake (mmol C/m3), default = 1.65625 (J: 0.25 mmol N/m3)
      alpha_n: 0.379                     # half-saturation for nitrogen uptake, (mmol C/m3),default=self%alpha)
      alpha_p: 0.0379                    # half-saturation for phophorus uptake, (mmol C/m3),default=self%alpha)
      beta: 3.7                          # temperature growth correction factor (-), default = 3.7
      r0: 4.57                           # maximum growth rate at 20 degrees C (1/d), default = 1.3
      nb: 0.052                          # excretion rate (1/d), default = 0.01
      deltao: 0.011                      # mortality rate (1/d), default = 0.02
      Yc: 2.92                           # carbon : chlorophyll a ratio (mmol C/mg Chl a), default = 6.25
      wz: -0.07                          # vertical velocity (positive: upwards/floating, negative: downwards/sinking) (m/d), default = 0.0
      kc: 0.629                          # specific light attenuation (m2/mmol C)
      sedrate: 0.24                      # sedimentation rate (m/d), default = 0.0
      tau_crit: 0.02                     # critical shear stress (N/m2), default = 0.07
      buoyancy_regulation: false         # whether cells can regulate vertical movement, default=false
      buoy_temperature: false            # whether temperature can regulate buoyancy, if buoyancy_regulation=true, default=false
      buoy_nutrient: false               # whether nutrient limitation can regulate buoyancy, if buoyancy_regulation=true, default=false
      tlim: 2                            # temperature limitation of growth (0: none, 1: (degrees C^2), half-saturation temperature, squared. 2: (degrees C), exponential decay, tll is half decay
      tll: 8.9                           # lower temperature limit (degrees C), default for tlim=1 = 13.5; default for tlim=2 = 100
      llim: 2                            # light limitation of growth (1: Reynolds, 2: Selma), default=1
      alpha_light: 0.1                   # Reynolds (llim=1): the slope of light-dependent growth (d-1 [W/m2]-1), default=0.1
      imin: 47.9                         # Selma (llim=2): minimal optimal light radiation (W/m2), default=50
    coupling:
      aa: selmaprotbas/aa                # ammonium (mmol N/m3)
      nn: selmaprotbas/nn                # nitrate (mmol N/m3)
      o2: selmaprotbas/o2                # oxygen (mmol O2/m3)
      po: selmaprotbas/po                # phosphate (mmol P/m3)
      si: selmaprotbas/si                # silicate (mmol Si/m3)
      dd_c: selmaprotbas/dd_c            # carbon detritus (mmol C/m3)
      dd_p: selmaprotbas/dd_p            # phosphorus detritus (mmol P/m3)
      dd_n: selmaprotbas/dd_n            # nitrogen detritus (mmol N/m3)
      dd_si: selmaprotbas/dd_si          # silica detritus (mmol Si/m3)
      fl_c: selmaprotbas/fl_c            # carbon fluff (mmol C/m3)
      fl_p: selmaprotbas/fl_p            # phosphorus fluff (mmol P/m3)
      fl_n: selmaprotbas/fl_n            # nitrogen fluff (mmol N/m3)
      fl_si: selmaprotbas/fl_si          # silica fluff (mmol Si/m3)
    initialization:
      c: 0.0758                          # concentration (mmol C/m3)
  CyanoMC:
    model: selmaprotbas/phytoplankton
    parameters:
      c0: 0.0109                         # background concentration (mmol C/m3), default = 0.0
      rfr: 0.0474                        # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.203                         # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      rfs: 0                             # silica : carbon ratio (mol Si/mol C), default = 0.000
