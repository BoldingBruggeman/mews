      pref2: 0.2                         # preference for prey 2 (-), default = 1.0
      pref3: 0.7                         # preference for prey 3 (-), default = 1.0
      nue: 0.0012                        # respiration rate (m3/d/mmol C), default = 0.001509
      sigma_b: 0.0036                    # mortality rate (m3/d/mmol C), default = 0.004528
      iv: 0.133                          # Ivlev constant, quadratic (1/(mmol C/m3)2), default = 0.27341
