instances:
  selmaprotbas:
    model: selmaprotbas/selmaprotbas
    parameters:
      env_type: fresh                    # (Define environment type, either fresh or marine), default = marine
      wdz: -0.0238271020027966 # vertical velocity of detritus (positive: upwards/floating, negative: downwards/sinking) (m/d), default = -4.5
      wpo4: -1.0 # vertical velocity of suspended P-Fe (positive: upwards/floating, negative: downwards/sinking) (m/d), default = -1.0
      dn: 0.00104665962365618 # detritus mineralization rate (1/d), default = 0.003
      dn_sed: 0.0008 # sediment mineralization rate (1/d), default = 0.002
      kc: 0.013 # specific light attenuation of detritus (m2/mmol C), default = 0.0036
      q10_rec: 0.0608863496600511 # temperature dependence of detritus remineralization (1/K), default = 0.15
      ade_r0: 0.135 # maximum chemolithoautotrophic denitrification rate (1/d), default = 0.1
      alphaade: 1 # half-saturation constant for chemolithoautotrophic denitrification (mmol N/m3), default = 1.0
      mbnnrate: 0.1                      # mineralization by nitrate rate relative to mineralization by oxygen (-), default = 0.1
      nitrif_rate: 0.1 # nitrification rate (1/d), default = 0.1
      q10_recs: 0.0218086202746072 # temperature dependence of sediment remineralization (1/K), default = 0.175
      tau_crit: 0.07 # critical shear stress (N/m2), default = 0.07
      sedrate: 1.93421672869591 # detritus sedimentation rate (m/d), default = 2.25
      erorate: 6.0 # sediment erosion rate (1/d), default = 6.0
      sedratepo4: 0.5 # P-Fe sedimentation rate (m/d), default = 0.5
      eroratepo4: 6.0 # P-Fe erosion rate (1/d), default = 6.0
      po4ret: 0.18 # fraction of mineralized phosphate that is converted to iron-phosphate-complexes in oxic sediments (-), default = 0.18
      pburialrate: 0.007 # phosphate burial rate (1/d), default = 0.007
      fl_burialrate: 0.000273029110063912 # sediment burial rate (1/d), default = 0.001
      pliberationrate: 0.1 # phosphate liberation rate, anoxic sediments (1/d), default = 0.1
      ipo4th: 100.0 # maximum phosphorus density available for burial (mmol P/m2), default = 100.0
      br0: 0.025109668384417 # bioresuspension rate (1/d), default = 0.03
      fds: 0.7 # fraction of sediment remineralization fueled by denitrification (-), default = 0.7
      o2sat_method: 1                    # method to calculate oxygen saturation concentration (1=Weiss; 2=Helcom polynomial; 3=seawater temperature only), default = 1
      o2corr_method: 0                   # correct oxygen saturation for pressure (0=not used; 1=elevation-based; 2=pressure-based), default = 0
      o2pvel_method: 3                   # method to calculate piston velocity (1=user-defined parameter; 2=Liss & Merlivat; 3=Cole & Caroco, fresh; 4=Cole & Caroco, salt; 5=iHAMOCC model), default = 2
      diagnostics: false
    initialization:
      nn: 3.5                            # nitrate (mmol N/m3)
      aa: 0.85                           # ammonium (mmol N/m3)
      dd_c: 0.0                          # carbon detritus (mmol C/m3)
      dd_p: 0.0                          # phosphorus detritus (mmol P/m3)
      dd_n: 0.0                          # nitrogen detritus (mmol N/m3)
      dd_si: 20.0                        # silica detritus (mmol Si/m3)
      o2: 280.0                          # oxygen (mmol O2/m3)
      po: 0.216                          # phosphate (mmol P/m3)
      si: 1.000                          # silica (mmol Si/m3)
      fl_c: 400                          # carbon fluff (mmol C/m2)
      fl_p: 2.0                          # phosphorus fluff (mmol P/m2)
      fl_n: 30.0                         # nitrogen fluff (mmol N/m2)
      fl_si: 10.0                        # silica fluff (mmol Si/m2)
      pb: 0.03                           # phosphate bound to iron in sediment (mmol C/m2)
      pw: 0.001                          # phosphate bound to iron in water (mmol C/m3)
  phytoplankton:
    model: selmaprotbas/phytoplankton
    parameters:
      c0: 0.001 # background concentration (mmol C/m3), default = 0.0
      rfr: 0.00774094617668906 # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.232323465109688 # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      rfs: 0.0                           # silica : carbon ratio (mol Si/mol C), default = 0.000
      alpha_n: 0.22 # half-saturation concentration for nitrogen uptake (mmol N/m3), default = 0.25
      alpha_p: 0.016 # half-saturation concentration for phosphorus uptake (mmol P/m3), default = 0.015625
      alpha_si: 0.0                      # half-saturation concentration for silica uptake (mmol Si/m3), default = 0.0
      r0: 1.5 # maximum growth rate; tlim=1 - at 0 degC and 2*r0 at temp>>sqrt(tll); tlim=2 - at temp>>tll; tlim=3 or 4 - at 20 degC; tlim=5 - at temp_opt, default = 1.3
      tlim: 5                            # temperature limitation of growth (0: none, 1: flagellate-style, 2: cyanobacteria-style, 3:PROTECH-style, 4:optimal-stdev, 5: Lehman-equation, default = 0
      temp_opt: 16 # optimum temperature of growth rate (degrees C), default = 20.0
      temp_min: -4.92170871769173 # temperature below optimum where growth is 10% of maximum (degrees C), default = 0.0
      llim: 3                            # light limitation of growth (1: Reynolds, 2: Selma, 3: Reynolds-smoothed), default = 1
      alpha_light: 0.12105388214306 # the slope of light-dependent growth (d-1 [W/m2]-1), default = 0.1
      nb: 0.0160943948365659 # excretion rate (1/d), default = 0.01
      deltao: 0.0131702372253646 # mortality rate (1/d), default = 0.02
      Yc: 3.5 # carbon : chlorophyll a ratio (mmol C/mg Chl a), default = 6.25
      wz: -0.116299092486776 # vertical velocity (positive: upwards/floating, negative: downwards/sinking) (m/d), default = 0.0
      kc: 0.0111242742978449 # specific light attenuation (m2/mmol C), default = 0.0084
      sedrate: 0.0                       # sedimentation rate (m/d), default = 0.0. If > 0, you need to couple to fluff variables under "coupling"
      use_24h_light: true                # use 24h averaged light for growth, default = false
      couple_dom: true                   # couple phytoplankton to dom module, default = false
      f_diss: 0.2 # fraction of phytoplankton biomass that is dissolved, only used if couple_dom=true (-), default = 0.2
      diagnostics: false
    coupling:
      aa: selmaprotbas/aa                # ammonium (mmol N/m3)
      nn: selmaprotbas/nn                # nitrate (mmol N/m3)
      o2: selmaprotbas/o2                # oxygen (mmol O2/m3)
      po: selmaprotbas/po                # phosphate (mmol P/m3)
      si: selmaprotbas/si                # silicate (mmol Si/m3)
      dd_c: selmaprotbas/dd_c            # carbon detritus (mmol C/m3)
      dd_p: selmaprotbas/dd_p            # phosphorus detritus (mmol P/m3)
      dd_n: selmaprotbas/dd_n            # nitrogen detritus (mmol N/m3)
      dd_si: selmaprotbas/dd_si          # silica detritus (mmol Si/m3)
      dom_a: dom/dom_a                   # labile DOM (mg/m3)
    initialization:
      c: 0.006625                        # concentration (mmol C/m3)
  zooplankton:
    model: selmaprotbas/zooplankton
    parameters:
      c0: 0.006625                       # background concentration (mmol C/m3), default = 0.0
      rfr: 0.009434                      # phosphorus : carbon ratio (mol P/mol C), default = 1/106 = 0.009434
      rfn: 0.150943                      # nitrogen : carbon ratio (mol N/mol C), default = 16/106 = 0.150943
      rfs: 0                             # silica : carbon ratio (mol Si/mol C), default = 0
      nprey: 1                           # number of prey, default = 1
      nue: 0.002 # respiration rate (m3/d/mmol C), default = 0.001509
      sigma_b: 0.00025 # mortality rate (m3/d/mmol C), default = 0.004528
      iv: 0.121064783038157 # Ivlev constant, quadratic (1/(mmol C/m3)2), default = 0.27341
      graz: 0.142586251596067 # grazing rate (1/d), default = 0.5
      toptz: 20.0 # optimal temperature for grazing (deg C), default = 20.0
      zcl1: 55.0 # closure parameter (-), default = 50.0
      couple_dom: true                   # couple phytoplankton to dom module, default = false
      f_diss: 0.2 # fraction of zooplankton biomass that is dissolved, only used if DOM is coupled (-), default = 0.2
    coupling:
      prey1: phytoplankton               # prey 1
      aa: selmaprotbas/aa                # ammonium (mmol N/m3)
      po: selmaprotbas/po                # phosphate (mmol P/m3)
      si: selmaprotbas/si                # silicate (mmol Si/m3)
      dd_c: selmaprotbas/dd_c            # carbon detritus (mmol C/m3)
      dd_p: selmaprotbas/dd_p            # phosphorus detritus (mmol P/m3)
      dd_n: selmaprotbas/dd_n            # nitrogen detritus (mmol N/m3)
      dd_si: selmaprotbas/dd_si          # silica detritus (mmol Si/m3)
      o2: selmaprotbas/o2                # oxygen (mmol O2/m3)
      dom_a: dom/dom_a                   # labile DOM (mg/m3)
    initialization:
      c: 0.006625                        # concentration (mmol C/m3)
  dom:
    model: selmaprotbas/dom
    parameters:
      km_o2: 0.0123 # respiration (mmol/m3), default = 0.0123
      km_no3: 0.01 # denitrification (mmol/m3), default = 0.01
      k_inh_o2: 0.33 # inhibitation of denitrification by O2 (mmol/m3), default = 0.33
      k_om1: 0.654908452089329 # labile OM degradation rate (1/yr), default = 1.0
      k_om2: 0.0239616362046709 # semi-labile OM2 degradation rate (1/yr), default = 0.1
      theta: 1.047                       # Temperature adjustment coefficient (-), default = 1.047
      oc_dom: 0.01                       # Optical cross section of DOM (m2/mgDOM), default = 0.01
      qy_dom: 0.1                        # Quantum yield (mgDOM / mol PAR), default = 0.1
      e_par: 240800                      # Energy of PAR photons (J/mol), 240800
      k_floc: 2e-04 # flocculation rate (1/d), default = 0.0006
      mole_per_weight: 0.0416            # mole_per_weight (molC/gDOM), default = 0.0416
      n_use_factor: 0.2 # Factor of bacterial mineralisation as N flux (mmol N / mg DOM), default = 0.8
      k_leach: 0.0007 # Leaching constant, at 20 degrees (1/d), default = 0.001
      q_leach: 0.02                      # temperature dependence of leaching (1/K), default = 0.02
      ext_coef_a: 0.1 # Linear coefficient DOM light influence (m2/mgDOM), default = 0.1
      ext_coef_b: 1.22 # Exponential coefficient DOM light influence (-), default = 1.22
      diagnostics: false                 # toggle diagnostic output, default = false
    coupling:
      o2: selmaprotbas/o2                # oxygen (mmol O2/m3)
      nn: selmaprotbas/nn                # nitrate (mmol N/m3)
      aa: selmaprotbas/aa                # ammonium (mmol N/m3)
      dd_c: selmaprotbas/dd_c            # carbon detritus (mmol C/m3)
    initialization:
      dom_a: 280.0                       # labile DOM (mg/m3)
      dom_b: 10000.0                     # semi-labile DOM (mg/m3)
  # Atmospheric input      
  ammonium_input:
    model: constant_surface_flux
    parameters:
      flux: 6.2E-07 # flux (positive for into water) (UNITS m-2 s-1)
    coupling:
      target: selmaprotbas/aa            # target variable (UNITS m-3)
  nitrate_input:
    model: constant_surface_flux
    parameters:
      flux: 6.2E-07 # flux (positive for into water) (UNITS m-2 s-1)
    coupling:
      target: selmaprotbas/nn            # target variable (UNITS m-3)
  phosphate_input:
    model: constant_surface_flux
    parameters:
      flux: 4.1E-09 # flux (positive for into water) (UNITS m-2 s-1)
    coupling:
      target: selmaprotbas/po            # target variable (UNITS m-3)
  age:
    model: iow/age
    initialization:
      age_of_water: 0.0
